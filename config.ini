# proxyinject - behaviour settings. Reloaded automatically when saved.
# Applies to every process that has proxyinject.dll loaded.

# 1 = proxy traffic, 0 = pass everything straight through (off switch)
enabled = 0

# 1 = if the proxy fails, the connection is refused (your real IP is never
#     exposed). 0 = fall back to a direct connection.
fail_closed = 1

# 1 = block outbound UDP (QUIC etc.) so apps fall back to TCP, which we can
#     proxy. DNS over UDP is still allowed so name resolution keeps working.
block_udp = 1
allow_dns_udp = 1

# 0 = rotate only when told to. N = rotate every N seconds automatically and
#     drop live connections so the new IP is visible immediately.
rotate_sec = 0

# when the current proxy fails, move to the next one
retry_next = 1

# connect + handshake timeout in milliseconds
timeout_ms = 10000

# 1 = also intercept ConnectEx (used by Node/Electron/Chrome async sockets)
hook_connectex = 1

# for proxy lines without a scheme: auto | socks5 | http | socks4
default_scheme = auto

# index into proxies.txt, managed by rot.py
current = 11

# write logs\PID.log
log = 1
